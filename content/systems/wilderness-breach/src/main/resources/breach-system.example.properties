# Fatality Wilderness Breach. Copy to .data/config/breach-system.properties to override.
timeline.five-minute-warning-seconds=300
timeline.one-minute-warning-seconds=60
timeline.opening-seconds=10
timeline.active-minutes=15
timeline.collapse-seconds=5

# Roat-style contribution rewards.
reward.pk-points-per-damage=4
reward.pet-denominator=750
reward.radius=18
reward.drop-duration-ticks=300
reward.owner-reveal-ticks=150
contribution.retention-ticks=300
contribution.death-grace-ticks=50

# Every Breach boss starts at 30,000 HP. Each unique player who lands positive damage
# adds 5,000 maximum/current HP once for this event, capped at 65,000.
combat.hitpoints-per-attacker=5000
combat.maximum-scaled-hitpoints=65000
cerberus.hitpoints=30000
hunllef.hitpoints=30000
whisperer.hitpoints=30000
vardorvis.hitpoints=30000

# Revision-240 Wilderness doors/gates with real open states. These use the shared generic
# door engines so the visual state and collision update for every player.

[[object]]
id = "loc.wild_door"
inherit = "loc.wild_door"
contentGroup = "content.closed_single_door"
[object.params]
"param.next_loc_stage" = "loc.wild_door_open"
"param.opensound" = "synth.door_open"

[[object]]
id = "loc.wild_door_open"
inherit = "loc.wild_door_open"
contentGroup = "content.opened_single_door"
[object.params]
"param.next_loc_stage" = "loc.wild_door"

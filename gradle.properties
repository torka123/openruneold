group=org.rsmod
version=0.0.1-SNAPSHOT

# Required patched Central source; prepare with scripts/setup-openrune-central-s10.ps1.
# Explicit -P overrides must retain the pinned official source and the exact checked-in patch.
openrune.central.includeBuild=.gradle/openrune-central-s10

kotlin.code.style=official

org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
